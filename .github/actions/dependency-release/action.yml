name: Dependency and release control
description: Validate dependency updates and reconcile draft releases using GITHUB_TOKEN.
inputs:
  token:
    description: Repository GITHUB_TOKEN
    required: true
  mode:
    description: dependencies, prepare, discover, verify, containers, finalize, or ready
    required: true
  operation:
    description: reconcile, hold, resume, or preview
    default: reconcile
  release-id:
    description: Draft release ID
  tag:
    description: Version tag
  sha:
    description: Release pull request merge SHA
  initial-version:
    description: Initial product version for a repository without releases
outputs:
  pending:
    description: An unfinished managed release exists
  release-id:
    description: Draft release ID
  tag:
    description: Version tag
  sha:
    description: Release pull request merge SHA
  run-release-please:
    description: Release Please can run
  skip-github-release:
    description: Suppress tags and releases while previewing a held release
runs:
  using: node24
  main: dist/index.cjs
